  tester_title: Devenir testeur
  tester_p1: "Les versions de test de <strong>%s</strong> sont envoyées en privé aux testeurs, pour NeoSD / MiSTer, Darksoft et BackBit Platinum MVS."
  tester_p2: "Pour en recevoir une, ajoute-moi en ami sur Discord et envoie-moi un message en précisant ton matériel (console AES/MVS, linker, MiSTer…). En échange, je compte sur tes retours : bugs, ralentissements, différences avec l'arcade."
  tester_id: Mon pseudo Discord
  tester_copy: Copier
  tester_copied: "Copié ✓"
  tester_howto: "Dans Discord : <strong>Amis</strong> → <strong>Ajouter un ami</strong> → colle le pseudo."
  tester_open: Ouvrir Discord
  tool_title: Construire le jeu
  tool_p1: "Le jeu se construit à partir de <strong>votre propre romset MAME</strong> du jeu arcade original (<code>ghouls.zip</code>). L'outil ne contient aucune donnée du jeu original : uniquement le travail du portage."
  tool_need: "Il faut : Windows, Python 3.9+ et MAME (0.250 ou plus récent)."
  tool_steps: "Placez <code>ghouls.zip</code> dans le dossier de l'outil, puis double-cliquez sur <strong>Construire - Build.bat</strong>. En une à quelques minutes, vous obtenez les fichiers pour NeoSD / MiSTer, Darksoft, BackBit et MAME."
  tool_button: Télécharger l'outil
  tool_note: "Les ROMs produites sont pour votre usage personnel : merci de ne pas les distribuer."
  comments_title: Retours des testeurs
  comments_intro: "Bugs, ralentissements, différences avec l'arcade : indiquez votre matériel (console AES/MVS, NeoSD, Darksoft, BackBit, MiSTer, MAME) et l'endroit du jeu. Il faut un compte GitHub (gratuit) pour commenter. Les messages en français comme en anglais sont les bienvenus."
