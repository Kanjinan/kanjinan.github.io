---
layout: default
---
<h1>{{ site.title }}</h1>
<p class="intro">{{ site.description }}</p>
<ul class="posts">
{% for post in site.posts %}
  <li>
    <span class="meta">{{ post.date | date: '%d/%m/%Y' }}</span>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    {% if post.excerpt %}<div class="excerpt">{{ post.excerpt | strip_html | truncatewords: 30 }}</div>{% endif %}
  </li>
{% endfor %}
</ul>
