<dialog class="lightbox" aria-label="Image">
  <button type="button" class="lb-close" aria-label="Fermer / Close">×</button>
  <button type="button" class="lb-prev" aria-label="◀">‹</button>
  <img alt="">
  <button type="button" class="lb-next" aria-label="▶">›</button>
  <p class="lb-count"></p>
</dialog>
<script>
// Visionneuse : un lien vers une image (captures, images des billets) l'ouvre dans une fenêtre
// superposée au lieu d'une nouvelle page. Flèches / glisser : image suivante du même groupe.
(function () {
  var dlg = document.querySelector('dialog.lightbox');
  if (!dlg || typeof dlg.showModal !== 'function') return;  // très vieux navigateur : lien normal
  var img = dlg.querySelector('img'), count = dlg.querySelector('.lb-count');
  var liste = [], i = 0;
  var estImage = function (a) { return /\.(png|jpe?g|gif|webp)$/i.test(a.getAttribute('href') || '') && a.querySelector('img'); };
  function montrer(n) {
    i = (n + liste.length) % liste.length;
    var a = liste[i];
    img.src = a.href;
    img.alt = a.querySelector('img').alt || '';
    count.textContent = liste.length > 1 ? (i + 1) + ' / ' + liste.length : '';
    dlg.classList.toggle('seule', liste.length < 2);
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || !estImage(a) || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
    e.preventDefault();
    var groupe = a.closest('.gallery, .prose') || document.body;
    liste = Array.prototype.filter.call(groupe.querySelectorAll('a[href]'), estImage);
    montrer(liste.indexOf(a));
    dlg.showModal();
  });
  dlg.querySelector('.lb-close').onclick = function () { dlg.close(); };
  dlg.querySelector('.lb-prev').onclick = function () { montrer(i - 1); };
  dlg.querySelector('.lb-next').onclick = function () { montrer(i + 1); };
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', function () { img.removeAttribute('src'); });
  document.addEventListener('keydown', function (e) {
    if (!dlg.open) return;
    if (e.key === 'ArrowLeft') montrer(i - 1);
    if (e.key === 'ArrowRight') montrer(i + 1);
  });
  var x0 = null;
  dlg.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  dlg.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) montrer(i + (dx < 0 ? 1 : -1));
  });
})();
</script>
