{% if site.discord_user and site.discord_user != "" %}
{% assign t = site.data.i18n[page.lang] %}
<section class="testeurs">
  <h2>🎮 {{ t.tester_title }}</h2>
  <p>{{ t.tester_p1 | replace: "%s", page.titre }}</p>
  <p>{{ t.tester_p2 }}</p>
  <div class="discord-id">
    <span class="discord-label">{{ t.tester_id }}</span>
    <code id="discord-pseudo">{{ site.discord_user }}</code>
    <button type="button" class="button discord" id="discord-copier" data-copie="{{ t.tester_copy }}" data-copie-ok="{{ t.tester_copied }}" data-goatcounter-click="discord-{{ page.slug }}" data-goatcounter-title="Discord testeur {{ page.titre }}">{{ t.tester_copy }}</button>
  </div>
  <p class="meta">{{ t.tester_howto }} <a href="https://discord.com/app" target="_blank" rel="noopener">{{ t.tester_open }}</a></p>
</section>
<script>
(function () {
  var b = document.getElementById('discord-copier');
  if (!b) return;
  b.addEventListener('click', function () {
    var t = document.getElementById('discord-pseudo').textContent;
    function ok() { b.textContent = b.dataset.copieOk; setTimeout(function () { b.textContent = b.dataset.copie; }, 2000); }
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, function () {});
    else { var r = document.createRange(); r.selectNodeContents(document.getElementById('discord-pseudo')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  });
})();
</script>
{% endif %}
