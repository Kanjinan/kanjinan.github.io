{% if site.goatcounter and site.goatcounter != "" %}
<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
(function () {
  var base = 'https://{{ site.goatcounter }}.goatcounter.com/counter/';
  var els = document.querySelectorAll('[data-gc-path]');
  var pending = els.length;
  function done() {
    if (--pending > 0) return;
    // Classe les tableaux de la page Statistiques par nombre de vues
    document.querySelectorAll('table[data-sort] tbody').forEach(function (tb) {
      var rows = Array.prototype.slice.call(tb.rows);
      rows.sort(function (a, b) {
        var na = +(a.querySelector('[data-n]') || {dataset: {n: 0}}).dataset.n;
        var nb = +(b.querySelector('[data-n]') || {dataset: {n: 0}}).dataset.n;
        return nb - na;
      });
      rows.forEach(function (r) { tb.appendChild(r); });
    });
  }
  var locale = { fr: 'fr-FR', en: 'en-US', de: 'de-DE', es: 'es-ES', ja: 'ja-JP' }[document.documentElement.lang] || 'fr-FR';
  var tranche = Math.floor(Date.now() / 600000);
  function compte(path) {
    // GoatCounter enregistre les chemins sans barre finale (/jeux/x et non /jeux/x/)
    if (path.length > 1) path = path.replace(/\/$/, '');
    // start : sans lui, TOTAL ne compte qu'une petite période. t : change toutes les 10 min,
    // pour ne pas relire une réponse mise en cache 4 h par GoatCounter (un 0 y resterait figé).
    return fetch(base + encodeURIComponent(path) + '.json?start=2020-01-01&t=' + tranche)
      .then(function (r) { return r.status === 404 ? { count: '0' } : (r.ok ? r.json() : null); })
      .then(function (d) { return d ? (parseInt(String(d.count).replace(/\D/g, ''), 10) || 0) : null; })
      // Une requête qui échoue (réseau, limite de débit…) ne doit pas masquer tout le compteur
      .catch(function () { return null; });
  }
  els.forEach(function (el) {
    // Plusieurs chemins séparés par « | » (toutes les langues) : on additionne
    Promise.all(el.dataset.gcPath.split('|').map(compte))
      .then(function (ns) {
        if (ns.every(function (n) { return n === null; })) return;
        var n = ns.reduce(function (a, b) { return a + (b || 0); }, 0);
        el.dataset.n = n;
        var out = el.querySelector('.n') || el;
        out.textContent = n.toLocaleString(locale);
        el.hidden = false;
      })
      .catch(function () {})
      .then(done, done);
  });
})();
</script>
{% endif %}
