title: NicoKlem
description: Homebrews et portages de fan pour Neo Geo et Mega Drive, avec le journal de développement.
lang: fr
itch: https://nicoklem.itch.io
# Le dépôt s'appelle "kanjinan.github.io" : baseurl reste vide.
baseurl: ""
url: "https://kanjinan.github.io"
permalink: /devlog/:year/:month/:title/
markdown: kramdown
# Code GoatCounter (statistiques publiques) : https://<code>.goatcounter.com
# Laisser vide pour désactiver les statistiques.
goatcounter: "nicoklem"
# Pseudo Discord affiché dans la section « Devenir testeur » (mettre testeurs: true dans un jeu)
discord_user: "nicoklem"
# Commentaires (giscus, discussions GitHub) : mettre commentaires: true dans un jeu
giscus:
  repo: Kanjinan/kanjinan.github.io
  repo_id: "R_kgDOVuOIgQ"
  category: Commentaires
  category_id: "DIC_kwDOVuOIgc4DLH49"
# Langues du site, dans l'ordre du sélecteur (le français est la langue par défaut, à la racine)
langues: [fr, en, de, es, ja]
plugins:
  - jekyll-feed
  - jekyll-sitemap
feed:
  posts_limit: 30
  categories: [fr, en, de, es, ja]
collections:
  jeux:
    output: true
    permalink: /jeux/:name/
defaults:
  # Français par défaut
  - scope: { path: "" }
    values: { lang: fr }
  - scope: { path: "", type: posts }
    values: { layout: post, lang: fr }
  - scope: { path: "_jeux", type: jeux }
    values: { lang: fr }
  # Anglais : tout ce qui est sous en/ et _jeux/en/
  - scope: { path: "en" }
    values: { lang: en }
  - scope: { path: "en", type: posts }
    values: { layout: post, lang: en, permalink: "/en/devlog/:year/:month/:title/" }
  - scope: { path: "_jeux/en", type: jeux }
    values: { lang: en, permalink: "/en/games/:name/" }
  # Allemand, espagnol, japonais : même principe (de/, es/, ja/ et _jeux/de|es|ja/)
  - scope: { path: "de" }
    values: { lang: de }
  - scope: { path: "de", type: posts }
    values: { layout: post, lang: de, permalink: "/de/devlog/:year/:month/:title/" }
  - scope: { path: "_jeux/de", type: jeux }
    values: { lang: de, permalink: "/de/spiele/:name/" }
  - scope: { path: "es" }
    values: { lang: es }
  - scope: { path: "es", type: posts }
    values: { layout: post, lang: es, permalink: "/es/devlog/:year/:month/:title/" }
  - scope: { path: "_jeux/es", type: jeux }
    values: { lang: es, permalink: "/es/juegos/:name/" }
  - scope: { path: "ja" }
    values: { lang: ja }
  - scope: { path: "ja", type: posts }
    values: { layout: post, lang: ja, permalink: "/ja/devlog/:year/:month/:title/" }
  - scope: { path: "_jeux/ja", type: jeux }
    values: { lang: ja, permalink: "/ja/games/:name/" }
exclude: [README.md]
