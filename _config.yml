title: NicoKlem
description: Homebrews et portages de fan pour Neo Geo et Mega Drive, avec le journal de développement.
lang: fr
itch: https://nicoklem.itch.io
# Le dépôt s'appelle "kanjinan.github.io" : baseurl reste vide.
baseurl: ""
url: "https://kanjinan.github.io"
permalink: /devlog/:year/:month/:title/
markdown: kramdown
# Code GoatCounter (statistiques publiques) : https://<code>.goatcounter.com
# Laisser vide pour désactiver les statistiques.
goatcounter: "nicoklem"
# Pseudo Discord affiché dans la section « Devenir testeur » (mettre testeurs: true dans un jeu)
discord_user: "nicoklem"
plugins:
  - jekyll-feed
  - jekyll-sitemap
feed:
  posts_limit: 30
  categories: [fr, en]
collections:
  jeux:
    output: true
    permalink: /jeux/:name/
defaults:
  # Français par défaut
  - scope: { path: "" }
    values: { lang: fr }
  - scope: { path: "", type: posts }
    values: { layout: post, lang: fr }
  - scope: { path: "_jeux", type: jeux }
    values: { lang: fr }
  # Anglais : tout ce qui est sous en/ et _jeux/en/
  - scope: { path: "en" }
    values: { lang: en }
  - scope: { path: "en", type: posts }
    values: { layout: post, lang: en, permalink: "/en/devlog/:year/:month/:title/" }
  - scope: { path: "_jeux/en", type: jeux }
    values: { lang: en, permalink: "/en/games/:name/" }
exclude: [README.md]
