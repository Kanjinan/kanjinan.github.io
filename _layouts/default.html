<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Articles</a>
      <a href="{{ '/fichiers/' | relative_url }}">Fichiers</a>
      <a href="{{ '/a-propos/' | relative_url }}">À propos</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer>© {{ 'now' | date: '%Y' }} {{ site.title }}, hébergé gratuitement sur GitHub Pages</footer>
</body>
</html>
