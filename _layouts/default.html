<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.resume | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  {% if page.cover %}<meta property="og:image" content="{{ page.cover | absolute_url }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}">Accueil</a>
        <a href="{{ '/jeux/' | relative_url }}">Jeux</a>
        <a href="{{ '/devlog/' | relative_url }}">Devlog</a>
        <a href="{{ '/fichiers/' | relative_url }}">Fichiers</a>
        <a href="{{ '/a-propos/' | relative_url }}">À propos</a>
      </nav>
    </div>
  </header>
  <main class="wrap">{{ content }}</main>
  <footer class="wrap">
    © {{ 'now' | date: '%Y' }} {{ site.title }} · <a href="{{ site.itch }}">Mes jeux sur itch.io</a>
  </footer>
</body>
</html>
